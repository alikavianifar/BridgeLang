{% load static %}
<!-- Contact Section -->
<section id="contact" class="contact section">

    <!-- Section Title -->
    <div style="padding-bottom: 70px;" class="container section-title" data-aos="fade-up">
        <h2>Contact</h2>
    </div><!-- End Section Title -->

    <div class="mb-5">
        <iframe style="width: 100%; height: 400px;"
            src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d3008.0916977641705!2d28.992127929196833!3d41.06698820586045!3m2!1i1024!2i768!4f13.1!5e0!3m2!1str!2str!4v1729874241804!5m2!1str!2str"
            frameborder="0" allowfullscreen=""></iframe>
    </div><!-- End Google Maps -->

    <div class="container" data-aos="fade">

        <div class="row gy-5 gx-lg-5">

            <div class="col-lg-4">

                <div class="info">
                    <h3>Get in touch</h3>
                    <p>Please feel free to get in touch if you have any questions, criticisms and suggestions.</p>
                    <div class="info-item d-flex">
                        <i class="bi bi-geo-alt flex-shrink-0"></i>
                        <div>
                            <h4>Location:</h4>
                            <p>Istanbul, Turkey</p>
                        </div>
                    </div><!-- End Info Item -->

                    <div class="info-item d-flex">
                        <i class="bi bi-envelope flex-shrink-0"></i>
                        <div>
                            <h4>Email:</h4>
                            <p>contact@bridgelang.com</p>
                        </div>
                    </div><!-- End Info Item -->

                    <div class="info-item d-flex">
                        <i class="bi bi-phone flex-shrink-0"></i>
                        <div>
                            <h4>Call:</h4>
                            <p>+90 XXX XXXX XXX</p>
                        </div>
                    </div><!-- End Info Item -->

                </div>

            </div>

            <div class="col-lg-8">
                <form action="{% url 'AppFolder:contact' %}" method="post" role="form" class="django-contact-form">
                    <div class="row">
						{% csrf_token %}
                        <div class="col-md-6 form-group">
                            <input type="text" name="name" class="form-control" id="name" placeholder="Your name" 
                            onfocus="this.placeholder = ''" onblur="this.placeholder = 'Enter your name'">
                        </div>

                        <div class="col-md-6 form-group mt-3 mt-md-0">
                            <input type="email" class="form-control" name="email" id="email" required="" placeholder="Email address" 
                            pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{1,63}$" onfocus="this.placeholder = ''" 
                            onblur="this.placeholder = 'Enter email address'">
                        </div>
                    </div>

                    <div class="form-group mt-3">
                        <input type="text" class="form-control" name="subject" id="subject" required="" placeholder="Subject" 
                        onfocus="this.placeholder = ''" onblur="this.placeholder = 'Enter subject'">
                    </div>

                    <div class="form-group mt-3">
                        <textarea class="form-control" name="message" placeholder="Messege" onfocus="this.placeholder = ''" 
                        onblur="this.placeholder = 'Enter Messege'" required=""></textarea>
                    </div>

                    <div class="text-center"><button type="submit">Send Message</button></div>
                </form>
            </div><!-- End Contact Form -->

        </div>

    </div>

</section><!-- /Contact Section -->
