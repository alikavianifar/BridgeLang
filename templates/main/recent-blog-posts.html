{% load static %}
{% load humanize %}
<!-- Recent Posts Section -->
<section id="recent-posts" class="recent-posts section">

  <!-- Section Title -->
  <div style="padding-bottom: 80px;" class="container section-title" data-aos="fade-up">
    <h2>Recent Blog Posts</h2>
  </div><!-- End Section Title -->

  <div class="container">

    <div class="row gy-4">

      {% for post in posts %}
      <div class="col-xl-4 col-md-6" data-aos="fade-up" data-aos-delay="100">
        <article>

          <div class="post-img">
            <img src="{{post.image.url}}" alt="" class="img-fluid">
          </div>

          <h2 style="height: 50px;" class="title">
            <a href="{% url 'BlogFolder:detail' id=post.id %}">{{post.title}}</a>
          </h2>

          <div style="height: 115px;">{{post.content|truncatewords_html:17|safe}}</div>
          <div class="d-flex align-items-center">
            
            <img src="{% static 'img/blog/anonymous.png' %}" alt="" class="img-fluid post-author-img flex-shrink-0">

            <div class="post-meta">
              <p class="post-author">
                {% if post.author %}
                <a class="author-link" href="{% url 'BlogFolder:author' author_id=post.author.id %}">{{post.author_full_name}}</a>
                {% else %}
                <span>Unknown Author</span>
                {% endif %}
              </p>
              <p class="post-date">
                <time>{{post.published_date|naturaltime}}</time>
              </p>
            </div>
          </div>

        </article>
      </div><!-- End post list item -->
      {% endfor %}

    </div><!-- End recent posts list -->

  </div>

</section><!-- /Recent Posts Section -->
