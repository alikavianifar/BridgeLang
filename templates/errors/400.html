<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Bad Request</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .error-container {
            background: #fff;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        h1 {
            font-size: 100px;
            color: #FFA500;
            margin: 0;
        }

        h2 {
            font-size: 24px;
            color: #343a40;
            margin: 10px 0;
        }

        p {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 20px;
        }

        .btn-back-home {
            display: inline-block;
            padding: 12px 24px;
            background-color: #FFA500;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn-back-home:hover {
            background-color: #ff8c00;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 70px;
            }

            h2 {
                font-size: 20px;
            }

            p {
                font-size: 16px;
            }

            .error-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>400</h1>
        <h2>Bad Request</h2>
        <p>Your request could not be processed due to a client error. Please check your input and try again.</p>
        <a href="/" class="btn-back-home">Back to Home</a>
    </div>

</body>
</html>
